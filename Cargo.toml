[package]
name = "sol-shred-sdk"
version = "4.0.0"
edition = "2021"
authors = []
repository = "https://github.com/0xfnzero/sol-shred-sdk"
description = "Solana raw shred and ShredStream decoding SDK with multi-DEX event parsing."
license = "MIT"
keywords = ["solana", "shredstream", "shred", "dex", "parser"]
readme = "README.md"
autobins = false
exclude = [
    "jetstream_protos/**",
    "src/connector/**",
    "src/decoder/**",
    "src/main.rs",
    "filters.json",
    "src/filters.json",
]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.cargo-machete]
# Referenced from tonic-prost generated code included through OUT_DIR.
ignored = ["prost-types", "tonic-prost"]

[features]
default = ["parse-borsh"]
parse-borsh = []
parse-zero-copy = []
perf-stats = []
ultra-perf = []

[dependencies]
# Solana/Agave 4.2 dependencies. Keep the modular SDK crates aligned with
# solana-entry so Entry and VersionedTransaction are the same concrete types.
solana-commitment-config = "=3.1.1"
solana-entry = "=4.2.2"
solana-hash = { version = ">=4.4.0, <4.6.0", features = ["serde", "wincode"] }
solana-ledger = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-message = ">=4.2.3, <4.5.0"
solana-program-pack = "=3.1.0"
solana-pubkey = { version = ">=4.2.0, <4.3.0", features = ["borsh", "serde"] }
solana-pubsub-client = "=4.2.2"
solana-rpc-client = "=4.2.2"
solana-rpc-client-api = "=4.2.2"
solana-sha256-hasher = "=3.1.0"
solana-signature = { version = ">=3.4.1, <3.5.0", features = ["serde"] }
solana-system-interface = ">=3.2.0, <3.3.0"
solana-transaction = { version = ">=4.1.4, <4.2.0", features = ["serde", "wincode"] }
lru = "=0.18.3"
libc = "0.2"

# SPL account-layout interfaces; program processors are not needed by this SDK.
spl-token-interface = "=3.0.0"
spl-token-2022-interface = "=3.1.1"

# Serialization and encoding
borsh = { version = "1.5.3", features = ["derive"] }
serde = { version = "1.0.215", features = ["derive"] }
wincode = "=0.5.5"

# Async runtime and networking
tokio = { version = "1.42.0", features = ["net", "rt", "sync", "time"] }
futures = { version = "0.3.31", default-features = false, features = ["async-await", "std"] }
crossbeam-queue = "0.3.12"

# gRPC and WebSocket
yellowstone-grpc-proto = { version = "12.7.0", default-features = false }
tonic = { version = "=0.14.6", default-features = false, features = ["channel", "codegen", "server", "tls-native-roots"] }
tonic-prost = "=0.14.6"
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }

# Utilities
base64 = "0.22.1"
base64-simd = "0.8"
bs58 = "0.5.1"
memchr = "2.7"
anyhow = "1.0.90"
log = "0.4.22"
thiserror = "2.0.11"
prost = "=0.14.4"
prost-types = "=0.14.4"
socket2 = "0.6.1"
reed-solomon-erasure = "6.0.0"
serde-big-array = "0.5.1"
smallvec = "1.13"

[build-dependencies]
protobuf-src = "1"
tonic-prost-build = "=0.14.6"

[dev-dependencies]
serde_json = "1.0.134"
solana-keypair = "=3.1.2"
solana-system-transaction = "=4.0.0"
